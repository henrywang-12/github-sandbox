name: Demo correctness

on:
  pull_request:
    paths: ['demo/**', '.github/workflows/demo.yml']
  push:
    branches: [main]
    paths: ['demo/**', '.github/workflows/demo.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  correctness:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and CLI tests
        run: python -W error::ResourceWarning -m unittest discover -s demo -v
      - name: Recovery scenarios
        run: python demo/scenarios.py
      - name: Demonstration smoke test
        run: python demo/runtime.py --state-dir "${RUNNER_TEMP}/intent-smoke"
